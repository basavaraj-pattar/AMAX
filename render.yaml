services:
  - type: web
    name: amax-api
    runtime: node
    plan: starter
    buildCommand: npm ci --prefix server
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    disk:
      name: amax-api-storage
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DIR
        value: /var/data
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
